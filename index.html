
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCheck - Student Wellness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg-app: #f4f7ff;
            --bg-surface: rgba(255, 255, 255, 0.7);
            --bg-accent: rgba(248, 250, 252, 0.5);
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-sub: #94a3b8;
            --border-color: rgba(226, 232, 240, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --shadow-liquid: 0 20px 40px -10px rgba(79, 70, 229, 0.1);
        }

        [data-theme='dark'] {
            --bg-app: #020617;
            --bg-surface: rgba(30, 41, 59, 0.6);
            --bg-accent: rgba(51, 65, 85, 0.4);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-sub: #64748b;
            --border-color: rgba(51, 65, 85, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
            --shadow-liquid: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        [data-theme='amoled'] {
            --bg-app: #000000;
            --bg-surface: rgba(18, 18, 18, 0.8);
            --bg-accent: rgba(24, 24, 27, 0.6);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --text-sub: #52525b;
            --border-color: #27272a;
            --glass-border: rgba(255, 255, 255, 0.03);
            --shadow-liquid: none;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: -0.011em;
        }

        .liquid-glass {
            background: var(--bg-surface);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-liquid);
        }

        .squircle-lg { border-radius: 3.5rem; }
        .squircle-md { border-radius: 2.5rem; }
        .squircle-sm { border-radius: 1.5rem; }

        /* Smoother animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.1);
            border-radius: 10px;
        }
        [data-theme='dark'] .custom-scrollbar::-webkit-scrollbar-thumb,
        [data-theme='amoled'] .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
